<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11130f" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Kairven</title>
    <style>
      :root{font-family:Inter Tight,Arial,sans-serif;color:#f1f6ef;background:#0b1712}
      *{box-sizing:border-box}
      body{display:grid;min-height:100vh;margin:0;padding:24px;place-items:center}
      main{width:min(100%,760px)}
      p{color:#b5c6bd;line-height:1.7}
      .eyebrow{color:#c9f25f;font-size:12px;letter-spacing:0;text-transform:uppercase}
      h1{font-size:clamp(40px,8vw,76px);font-weight:500;line-height:1;letter-spacing:-.06em}
      .actions{display:flex;flex-wrap:wrap;gap:12px}
      a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 17px;border:1px solid #c9f25f;background:#c9f25f;color:#0b1712;font-size:13px;font-weight:700;text-decoration:none}
      a.secondary{border-color:#345047;background:transparent;color:#f1f6ef}
      a:focus-visible{outline:3px solid #c9f25f;outline-offset:4px}
      @media(max-width:420px){.actions{align-items:stretch;flex-direction:column}}
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 / Page not found</p>
      <h1>This address does not lead to a page.</h1>
      <p>Check the address, return to the Kairven home page or get in touch about your enquiry path.</p>
      <div class="actions">
        <a href="/">Return home</a>
        <a class="secondary" href="/#contact">See where your enquiries leak</a>
      </div>
    </main>
  </body>
</html>
